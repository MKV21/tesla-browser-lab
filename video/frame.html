<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Videoframe</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:system-ui,sans-serif}
video{width:100%;height:150px;background:#111;object-fit:contain;display:block}
button{font:inherit;font-size:18px;min-height:52px;width:100%;border:0;background:#155968;color:#fff}

</style>
</head>
<body>
<video id="v" playsinline webkit-playsinline loop></video>
<button id="b" type="button">Im Frame starten</button>
<p id="s">Frame bereit</p>
<script src="frame.js"></script>
</body>
</html>
