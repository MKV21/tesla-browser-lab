function openVoice(){if(state.callActive)return;if(state.voice&&state.voice.stage!=='sent'){state.voice.open=true;renderVoice();return;}const isSession=state.view==='sessions';const item=isSession?bySession(state.session):state.view==='messages'&&state.source==='whatsapp'?byChat(state.chat):null;if(!item){notify('Demo · Zuerst einen WhatsApp-Chat oder eine Session öffnen.');return;}state.read=null;renderRead();state.voice={recipient:Object.freeze({id:item.id,title:item.title,kind:isSession?'session':'chat'}),text:'',revision:0,approved:null,stage:'listening',open:true};renderVoice();renderCommand();}
function renderVoice(){const root=document.getElementById('voice-root'),v=state.voice;if(!v||!v.open){root.innerHTML='';return;}const session=v.recipient.kind==='session',sent=v.stage==='sent',listening=v.stage==='listening';root.innerHTML=`<section id="voice-dialog" class="dialog-panel" role="dialog" aria-modal="false" aria-labelledby="voice-title"><header class="dialog-heading"><div><div class="dialog-label">Kein Mikrofon · kein Versand</div><h2 id="voice-title">${session?'Session fortsetzen':'Antwort entwerfen'}</h2></div><button class="icon" data-action="${sent?'close-voice':'minimize-voice'}" aria-label="${sent?'Dialog schließen':'Entwurf minimieren'}">${sent?'×':'−'}</button></header><div class="voice-status"><strong id="voice-state">${sent?(session?'Fortsetzung simuliert · Dialog beendet':'Senden simuliert · Dialog beendet'):listening?'Zuhören · simuliert':'Dialog aktiv · simuliert'}</strong><span>${sent?'Nur die lokale Demo wurde verändert. Nichts wurde übertragen.':listening?'Keine Aufnahme. Übernimm ein Beispiel statt zu sprechen.':'Korrektur und Freigabe bleiben in diesem Dialog. Kein Audio.'}</span></div><div class="recipient">${session?'Unveränderliches Session-Ziel':'Unveränderlicher Empfänger'}<strong id="draft-recipient">${esc(v.recipient.title)}</strong></div><div class="dialog-scroll">${listening?`<p class="read-note">Auch ein Ansichtswechsel ändert dieses Ziel nicht. Du kannst den Dialog jederzeit abbrechen.</p><div class="dialog-actions"><button class="primary wide" data-action="sample-draft">Beispiel übernehmen</button></div>`:`<label class="draft-label" for="draft-text"><span>${session?'Demo-Prompt':'Antwortentwurf · noch ungesendet'}</span><span id="draft-revision">Revision ${v.revision} · Demo</span></label><textarea id="draft-text" ${sent?'readonly':''}>${esc(v.text)}</textarea>${sent?'':`<p class="approval-note" id="approval-state" aria-live="polite">${v.approved?'Demo-Freigabe gilt nur für dieses Ziel und diese Textrevision.':session?'Fortsetzung findet ausschließlich im fiktiven Verlauf statt.':'Vorlesen ist hier nur textlich simuliert. Text prüfen; Änderungen entwerten jede Freigabe.'}</p><div class="dialog-actions"><button data-action="correct-draft">Korrektur simulieren</button>${session?'':`<button data-action="approve-draft">Text freigeben · Demo</button>`}<button class="primary wide" id="demo-send" data-action="send-draft" ${!session&&!v.approved?'disabled':''}>${session?'In Session fortsetzen · Demo':'Jetzt Demo senden'}</button></div>`}` }</div><footer class="dialog-footer">${sent?'<button data-action="close-voice">Schließen</button>':'<button data-action="abort-voice">Abbrechen</button><button data-action="minimize-voice">Entwurf parken</button>'}</footer></section>`;}
function changeDraft(text){const v=state.voice;if(!v||v.stage==='sent')return;v.text=text;v.revision++;v.approved=null;v.stage='draft';}
function approveDraft(){const v=state.voice;if(!v||!v.text.trim())return;v.approved=Object.freeze({id:v.recipient.id,kind:v.recipient.kind,revision:v.revision,text:v.text});renderVoice();}
function sendDraft(){const v=state.voice;if(!v||v.stage==='sent'||!v.text.trim())return;const session=v.recipient.kind==='session';if(!session&&(!v.approved||v.approved.id!==v.recipient.id||v.approved.revision!==v.revision||v.approved.text!==v.text))return;const target=session?bySession(v.recipient.id):byChat(v.recipient.id);target.messages.push(message('Du','09:50',v.text,{own:true,simulated:true}));target.recent=++state.eventSequence;if(session){target.activity='09:50 · Demo';target.messages.push(message('Hermes · Demo','09:50','Dein Demo-Prompt bleibt in dieser bestehenden Session. Es wurde kein Modell oder Werkzeug aufgerufen.'));}else target.time='09:50';v.stage='sent';v.approved=null;render();renderVoice();}
function openRead(singleId){const c=byChat(state.chat);if(!c)return;state.read={chatId:c.id,title:c.title,block:singleId?c.messages.filter(m=>m.id===singleId):[...(state.readBlocks[c.id]||[])],cursor:state.readCursors[c.id]??c.messages.length,single:!!singleId};renderRead();}
function renderRead(){const root=document.getElementById('read-root'),r=state.read;if(!r){root.innerHTML='';return;}root.innerHTML=`<section class="dialog-panel" id="read-dialog" role="dialog" aria-modal="false" aria-labelledby="read-title"><header class="dialog-heading"><div><div class="dialog-label">Stille Demo · kein Audio</div><h2 id="read-title">Originale vorlesen</h2></div><button class="icon" data-action="close-read" aria-label="Vorlese-Demo schließen">×</button></header><p class="read-note">${esc(r.title)} · ${r.single?'einzelne Nachricht':'Beim Öffnen festgehaltener Block seit dem letzten Demo-Besuch'}. Eingänge werden nicht automatisch angehängt.</p><div class="read-content" id="read-content">${r.block.length?r.block.map(m=>`<div class="read-block"><strong>${esc(m.sender)} · ${esc(m.time)}</strong><p>${esc(m.text)}</p></div>`).join(''):'<p class="read-empty">Keine weiteren ungelesenen Textnachrichten seit dem letzten Demo-Besuch.</p>'}</div><div class="dialog-actions"><button data-action="incoming-read">Demo: neuer Eingang</button><button class="primary" data-action="read-next">Weiter · Demo</button></div><footer class="dialog-footer"><button data-action="close-read">Beenden</button></footer></section>`;}
function nextRead(){const r=state.read;if(!r)return;const c=byChat(r.chatId);r.block=c.messages.slice(r.cursor).filter(m=>!m.own&&!m.media);r.cursor=c.messages.length;state.readCursors[c.id]=r.cursor;state.visits[c.id]=r.cursor;renderRead();}
function backList(){state.mobileList=true;state.maximized=false;if(VARIANT==='leseraum'){if(state.view==='sessions')state.session=null;else state.chat=null;}render();}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;if(b.dataset.view){setView(b.dataset.view);return;}if(b.dataset.source){state.source=b.dataset.source;state.mobileList=false;render();return;}if(b.dataset.chat){selectChat(b.dataset.chat);return;}if(b.dataset.session){selectSession(b.dataset.session);return;}if(b.dataset.openSession){selectSession(b.dataset.openSession);return;}if(b.dataset.readOne){openRead(b.dataset.readOne);return;}if(b.id==='simulate-message'){incoming();return;}if(b.id==='simulate-call'){startCall();return;}if(b.id==='mic-button'){openVoice();return;}const v=state.voice;switch(b.dataset.action){case 'maximize':state.maximized=!state.maximized;render();break;case 'back-list':backList();break;case 'sample-draft':changeDraft(v.recipient.kind==='session'?'Vergleiche bitte die zwei Möglichkeiten in diesem Gespräch.':'Wir treffen uns um zehn am kleinen Parkplatz.');renderVoice();renderCommand();break;case 'correct-draft':changeDraft(v.text+' Ich bringe Wasser mit.');renderVoice();break;case 'approve-draft':approveDraft();break;case 'send-draft':sendDraft();break;case 'abort-voice':state.voice=null;renderVoice();renderCommand();notify('Demo-Dialog abgebrochen. Kein Audio, kein Versand.');break;case 'minimize-voice':v.open=false;renderVoice();renderCommand();notify('Demo-Entwurf geparkt. Empfänger bleibt '+v.recipient.title+'.');break;case 'close-voice':state.voice=null;renderVoice();renderCommand();break;case 'session-draft':openVoice();break;case 'read-chat':openRead();break;case 'close-read':state.read=null;renderRead();break;case 'incoming-read':incoming(state.read.chatId,'Ich bin schon am Treffpunkt.');break;case 'read-next':nextRead();break;case 'hangup':state.callActive=false;render();notify('Demo-Anruf beendet. Bereits angenommene Demo-Aufträge laufen weiter.');break;}});
document.addEventListener('input',event=>{if(event.target.id!=='draft-text')return;changeDraft(event.target.value);const v=state.voice;document.getElementById('draft-revision').textContent='Revision '+v.revision+' · Demo';document.getElementById('approval-state').textContent='Text geändert: Die vorherige Freigabe ist ungültig.';document.getElementById('demo-send').disabled=v.recipient.kind==='chat'||!v.text.trim();});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(state.read){state.read=null;renderRead();}else if(state.voice&&state.voice.open){state.voice=null;renderVoice();renderCommand();notify('Demo-Dialog abgebrochen.');}}});
render();
</script>
</body>
</html>
